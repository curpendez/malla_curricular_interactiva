<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7fcfb">
  <title>Iniciar sesión | Ruta Académica</title>
  <style id="login-estilos-integrados">
/* Diseño de acceso de Ruta Académica, inspirado en la referencia suministrada */
:root{--teal:#087f78;--teal-dark:#003b40;--teal-light:#67c8c5;--border:#b6c6c9;--ink:#092d32}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink)}
body{background:#f9fdfc}button,input{font:inherit}button{cursor:pointer}
.login-shell{position:relative;min-height:100svh;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 60% 40%,#fff 45%,#f1faf9 90%)}
.wave{position:absolute;z-index:-1;pointer-events:none}.wave-top{width:54vw;height:24vw;top:-13vw;left:-13vw;transform:rotate(-19deg);border-radius:48%;background:linear-gradient(130deg,#70c7c5,#c9ebea);opacity:.85}.wave-bottom{width:74vw;height:25vw;bottom:-19vw;right:-10vw;transform:rotate(-13deg);border-radius:50%;background:linear-gradient(90deg,#e3f5f4,#8ed4d1)}
.login-content{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr);width:min(1600px,100%);min-height:100svh;margin:auto;align-items:stretch;padding:clamp(25px,4vw,62px) clamp(20px,3vw,45px)}
.visual-area{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden}.hero-image{width:100%;max-width:760px;max-height:82vh;object-fit:contain;display:block;mix-blend-mode:multiply}
.divider{background:linear-gradient(to bottom,transparent,#b8d4d2 12%,#b8d4d2 88%,transparent);width:1px;margin-block:24px}
.form-area{display:flex;align-items:center;justify-content:center;min-width:0;padding:30px clamp(22px,5vw,78px)}.form-container{width:100%;max-width:620px}
.brand{display:flex;align-items:flex-start;justify-content:center;gap:20px;margin-bottom:clamp(36px,4.8vw,70px)}.cap-icon{width:clamp(75px,9vw,135px);height:auto;color:var(--teal);flex-shrink:0}.brand h1{margin:0;font-size:clamp(40px,4.7vw,77px);font-weight:800;line-height:.96;letter-spacing:-.045em;color:var(--teal-dark)}.brand p{margin:12px 0 0;font-size:clamp(13px,1.27vw,21px);white-space:nowrap;color:#16373c}
.login-box h2{font-size:clamp(31px,3vw,49px);font-weight:800;letter-spacing:-.035em;margin:0 0 32px;line-height:1.16}
.form-field{margin-bottom:18px}.input-shell{height:clamp(63px,5vw,78px);display:flex;align-items:center;gap:18px;border:1.7px solid var(--border);border-radius:12px;padding:0 22px;background:rgba(255,255,255,.80);transition:border-color .15s,box-shadow .15s}.input-shell:focus-within{border-color:var(--teal);box-shadow:0 0 0 4px rgba(8,127,120,.10)}.input-shell>svg{width:31px;height:31px;color:#173e44;flex-shrink:0}.input-shell input{width:100%;min-width:0;border:0;outline:0;background:none;color:var(--ink);font-size:clamp(16px,1.4vw,22px)}.input-shell input::placeholder{color:#64777c;opacity:1}.eye-button{border:0;background:none;display:grid;place-items:center;color:#0b3840;padding:6px;flex-shrink:0}.eye-button svg{width:31px;height:31px}.eye-button:focus-visible,.text-button:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:4px}
.input-help{display:block;color:#597176;font-size:12px;margin:7px 0 0 6px}.primary{display:block;width:100%;border:0;border-radius:15px;color:white;background:linear-gradient(100deg,#06837b,#068d81);height:clamp(63px,5vw,80px);font-size:clamp(21px,1.7vw,27px);font-weight:750;margin-top:29px;transition:filter .15s,transform .15s}.primary:hover{filter:brightness(1.07);transform:translateY(-1px)}.primary:disabled{opacity:.6;cursor:wait}
.feedback{background:#fff0ed;border:1px solid #e5b3ab;color:#9a251a;padding:12px 14px;border-radius:9px;font-size:14px;margin:12px 0 0}.feedback.info{background:#e7f6f3;border-color:#a1d8d0;color:#075f5b}
.account-actions{text-align:center;margin:24px 0 0}.text-button{border:0;background:transparent;color:var(--teal);font-size:clamp(15px,1.35vw,20px);padding:5px;text-decoration:none}.text-button:hover{text-decoration:underline}.registration-prompt{margin:17px 0 0;font-size:14px;color:#60777b}.text-button.strong{font-size:14px;font-weight:700}.hidden{display:none!important}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(max-width:1060px){.login-content{grid-template-columns:38% 1px 1fr}.form-area{padding-inline:clamp(18px,3vw,50px)}.brand{gap:10px}.brand p{white-space:normal}}
@media(max-width:720px){.login-shell{min-height:100svh}.login-content{display:block;padding:28px 18px}.visual-area,.divider{display:none}.form-area{padding:28px 12px}.form-container{max-width:530px}.brand{justify-content:center;gap:12px;margin-bottom:55px}.brand h1{font-size:42px}.cap-icon{width:80px}.brand p{font-size:13px}.login-box h2{font-size:35px}.wave-top{width:420px;height:230px;top:-155px;left:-140px}.wave-bottom{width:480px;height:170px;bottom:-100px;right:-130px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
  <script src="./auth/login.js" defer></script>
</head>

      <div class="divider" aria-hidden="true"></div>
      <section class="form-area">
        <div class="form-container">
          <header class="brand">
            <svg class="cap-icon" viewBox="0 0 144 116" fill="none" aria-hidden="true">
              <path d="M8 40 71 9l65 31-65 32L8 40Z" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
              <path d="M35 55v34c15 14 55 14 72 0V55" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
              <path d="M135 41v47" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><circle cx="135" cy="91" r="5" fill="currentColor"/>
            </svg>
            <div><h1>Ruta<br>Académica</h1><p>Tu malla curricular, siempre contigo</p></div>
          </header>
          <div class="login-box">
            <h2 id="formTitle">Iniciar Sesión</h2>
            <form id="authForm" novalidate>
              <div id="nameField" class="form-field hidden">
                <label class="sr-only" for="nombre">Nombre completo</label>
                <div class="input-shell">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.7"/><path d="M4 21c0-4 3-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                  <input id="nombre" name="nombre" type="text" maxlength="80" autocomplete="name" placeholder="Nombre completo">
                </div>
              </div>
              <div class="form-field">
                <label class="sr-only" for="correo">Correo institucional</label>
                <div class="input-shell">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.2" stroke="currentColor" stroke-width="1.7"/><path d="m3 7 9 7 9-7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  <input id="correo" name="correo" type="email" autocomplete="email" required maxlength="254" placeholder="@uamv.edu.ni" aria-describedby="emailHelp">
                </div>
                <small class="input-help" id="emailHelp">Usa tu correo institucional @uamv.edu.ni</small>
              </div>
              <div class="form-field">
                <label class="sr-only" for="clave">Contraseña</label>
                <div class="input-shell">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4.5" y="10" width="15" height="11" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.7"/><path d="M12 14v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                  <input id="clave" name="clave" type="password" autocomplete="current-password" required placeholder="Contraseña" minlength="10">
                  <button id="showPassword" class="eye-button" type="button" aria-label="Mostrar contraseña" aria-pressed="false">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
                  </button>
                </div>
              </div>
              <p id="passwordHint" class="input-help hidden">La contraseña debe tener entre 10 y 128 caracteres.</p>
              <p id="feedback" class="feedback hidden" role="alert" aria-live="polite"></p>
              <button id="submitBtn" class="primary" type="submit">Ingresar</button>
            </form>
            <div class="account-actions">
              <button id="forgotPassword" class="text-button" type="button">¿Olvidaste tu contraseña?</button>
              <p class="registration-prompt"><span id="accountPrompt">¿Aún no tienes una cuenta?</span> <button type="button" id="switchMode" class="text-button strong">Crear cuenta</button></p>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
